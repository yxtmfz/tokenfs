filesystem:
  mount_point: /mnt/tokenfs
  metadata_db: /var/lib/tokenfs/metadata/tokenfs.db
  temp_suffix: ".tokenfs_tmp"
  log_level: debug

policy:
  mode: local_first
  local_high_watermark: 0.90
  local_low_watermark: 0.75
  immutable_token_files: false
  checksum: fnv1a64
  # 热点提升默认关闭，便于和纯 local-first/remote-spill 策略做对照实验。
  promote_on_read: false
  promote_read_threshold: 2

gpus:
  - gpu_id: 0
    logical_root: /gpu0
    local_root: /var/lib/tokenfs/local/gpu0
    local_quota_mib: 64
    remote_backend: remote0

  - gpu_id: 1
    logical_root: /gpu1
    local_root: /var/lib/tokenfs/local/gpu1
    local_quota_mib: 64
    remote_backend: remote0

backends:
  - id: remote0
    # 本地开发时使用 directory；拿到真实 NVMe-oF 环境后可改为 nvmeof。
    type: directory
    root: /var/lib/tokenfs/remote-sim
    nvme_transport: tcp
    nvme_target_ip: "__SSD_TARGET_IP__"
    nvme_port: "4420"
    nvme_subnqn: "__SUBSYSTEM_NQN__"
    nvme_device: "/dev/nvmeXnY"
    nvme_mount: /srv/tokenfs/remote0
    nvme_filesystem: ext4

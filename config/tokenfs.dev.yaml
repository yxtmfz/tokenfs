filesystem:
  mount_point: /mnt/tokenfs
  metadata_db: /var/lib/tokenfs/metadata/tokenfs.db
  temp_suffix: ".tokenfs_tmp"
  log_level: debug

policy:
  mode: local_first
  local_high_watermark: 0.90
  local_low_watermark: 0.75
  immutable_token_files: false
  checksum: fnv1a64
  # 本地空间不足时按复用概率、重算代价、GPU 亲和度、文件大小和远端访问代价综合决策。
  placement_policy: value_aware
  local_eviction_policy: value_aware
  default_recompute_cost: 10
  default_remote_access_cost: 10
  value_promote_threshold: 100
  # 默认不开自适应迁移，避免影响 baseline；真实环境或专项实验中打开。
  adaptive_migration: false
  adaptive_remote_promote_us: 10000
  # 0 表示不限制。需要做 QoS 公平性实验时设置为具体 IOPS。
  qos_read_iops_per_gpu: 0
  qos_write_iops_per_gpu: 0
  # 同内容文件在同一文件系统内可用硬链接共享物理数据；跨文件系统时自动降级为只记录去重机会。
  physical_dedup: true
  # 热点提升默认关闭，便于和纯 local-first/remote-spill 策略做对照实验。
  promote_on_read: false
  promote_read_threshold: 2
  # 顺序 shard 预取默认关闭；实验时开启，用于比较远端读取和提前回迁本地的收益。
  prefetch_on_read: false

gpus:
  - gpu_id: 0
    logical_root: /gpu0
    local_root: /var/lib/tokenfs/local/gpu0
    local_quota_mib: 64
    remote_backend: remote0

  - gpu_id: 1
    logical_root: /gpu1
    local_root: /var/lib/tokenfs/local/gpu1
    local_quota_mib: 64
    remote_backend: remote0

backends:
  - id: remote0
    # 本地开发时使用 directory；拿到真实 NVMe-oF 环境后可改为 nvmeof。
    type: directory
    root: /var/lib/tokenfs/remote-sim
    nvme_transport: tcp
    nvme_target_ip: "__SSD_TARGET_IP__"
    nvme_port: "4420"
    nvme_subnqn: "__SUBSYSTEM_NQN__"
    nvme_device: "/dev/nvmeXnY"
    nvme_mount: /srv/tokenfs/remote0
    nvme_filesystem: ext4

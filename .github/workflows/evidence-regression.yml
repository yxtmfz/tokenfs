name: Evidence regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libfuse3-dev libsqlite3-dev libyaml-cpp-dev
      - name: Configure and build Release
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release -j 2
      - name: Test real metadata and lookup eviction synchronization
        run: ctest --test-dir build-release --output-on-failure
      - name: Test policy accounting and evidence audits
        run: python3 -m unittest tests.aura_kv_unit_test tests.evidence_test tests.measured_study_test tests.affinity_joint_test
      - name: Test affinity-demand study controls
        run: python3 -m unittest tests.affinity_v2_test tests.affinity_v3_test
      - name: Test minimal paper experiment controls
        run: python3 -m unittest tests.paper_minimal_test
      - name: Test bounded shared-cache pilot controls
        run: python3 -m unittest tests.shared_cache_pilot_test
      - name: Test bounded shared-placement factorial controls
        run: python3 -m unittest tests.shared_joint_pilot_test
      - name: Test causal reuse pilot controls
        run: python3 -m unittest tests.causal_reuse_pilot_test
      - name: Test compact planning closeout controls
        run: python3 -m unittest tests.compact_planning_test
      - name: Test burst reuse SIEVE comparisons
        run: python3 -m unittest tests.burst_reuse_test
      - name: Test adaptive control study gates
        run: python3 -m unittest tests.adaptive_control_test
      - name: Test bounded request-correlated diagnostics
        run: python3 -m unittest tests.tail_diagnostic_test
      - name: Test fair read-fill pilot controls
        run: python3 -m unittest tests.read_fill_study_test
      - name: Test request-cost sampling and final evidence counters
        run: python3 -m unittest tests.request_cost_study_test tests.final_metrics_test
      - name: Test incremental copy cost study controls
        run: python3 -m unittest tests.incremental_cost_study_test
      - name: Test fair bounded inflight sharing controls
        run: python3 -m unittest tests.inflight_shared_study_test
      - name: Test isolated shared-placement and joint ablations
        run: python3 -m unittest tests.component_ablation_test
      - name: Test positive-gain acceptance and planning efficiency controls
        run: python3 -m unittest tests.planning_efficiency_test
      - name: Test burst recurrence comparison controls
        run: python3 -m unittest tests.burst_interval_study_test tests.headroom_exploration_test
      - name: Test balanced stationary repeats and stability summaries
        run: python3 -m unittest tests.stationary_stability_test
      - name: Test gated recurrence integrated controls
        run: python3 -m unittest tests.integrated_hpj_guarded_study_test
      - name: Test frozen-binary reverse-order invariants
        run: python3 -m unittest tests.integrated_hpj_reverse_test
      - name: Test retained capture ablation controls
        run: python3 -m unittest tests.integrated_hpj_retained_test
      - name: Test symmetric read capture ablation controls
        run: python3 -m unittest tests.integrated_hpj_symmetric_test
      - name: Test symmetric capture reverse-order invariants
        run: python3 -m unittest tests.integrated_hpj_symmetric_reverse_test
      - name: Test bounded cost calibration ablations
        run: python3 -m unittest tests.integrated_hpj_calibrated_test
      - name: Test calibrated capture reverse-order invariants
        run: python3 -m unittest tests.integrated_hpj_calibrated_reverse_test
